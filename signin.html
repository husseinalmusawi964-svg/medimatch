<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatch - الدخول وإنشاء حساب</title>

    <link rel="stylesheet" href="stiyel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #f4f7f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        .auth-container { 
            max-width: 460px; 
            margin: 30px auto; 
            background: #fff; 
            padding: 28px; 
            border-radius: 18px; 
            box-shadow: 0 10px 25px rgba(43, 88, 63, 0.08); 
            border: 1px solid #d4ebd4; 
            text-align: right; 
            box-sizing: border-box; 
            position: relative; 
        }

        /* أزرار التنقل بين التبويبات */
        .tab-buttons {
            display: flex;
            background: #e2efe2;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 22px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #2b583f;
            font-weight: bold;
            font-size: 0.92rem;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #2b583f;
            color: white;
            box-shadow: 0 2px 8px rgba(43, 88, 63, 0.2);
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 14px;
        }

        .input-group-custom i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #2b583f;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .custom-input { 
            width: 100%; 
            padding: 11px 40px 11px 12px; 
            border: 1px solid #cce5cc; 
            border-radius: 10px; 
            font-size: 0.92rem; 
            background: #fafcfb; 
            box-sizing: border-box; 
            outline: none; 
            transition: 0.3s; 
        }
        
        .custom-input:focus { 
            border-color: #2b583f; 
            background: #fff; 
            box-shadow: 0 0 6px rgba(43, 88, 63, 0.2); 
        }

        .form-label {
            display: block; 
            margin-bottom: 5px; 
            color: #2b583f; 
            font-weight: bold; 
            font-size: 0.85rem;
        }
        
        .btn-submit { 
            background: #2b583f; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 13px; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 0.98rem; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 5px;
        }

        .btn-submit:hover { 
            background: #224431; 
        }

        /* شريط التنبيهات الداخلي */
        .inline-alert {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: bold;
            margin-bottom: 18px;
            text-align: center;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .alert-error { 
            background-color: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
        }

        .alert-success { 
            background-color: #d4edda; 
            color: #155724; 
            border: 1px solid #c3e6cb; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .auth-container { margin: 15px 10px; padding: 20px; }
        }
    </style>
</head>

            <a href="help.html">Help</a>
        </div>
    </div>
