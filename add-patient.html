    <!-- كود جافاسكريبت وربط Firebase مع ضغط الصور السريع -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrVLbKYdOZjZwo4ZpTuT2mhhJNG_UQUYc",
            authDomain: "madimatch.firebaseapp.com",
            projectId: "madimatch",
            storageBucket: "madimatch.firebasestorage.app",
            messagingSenderId: "243542423910",
            appId: "1:243542423910:web:98422e0330e2b8237fb0a7",
            measurementId: "G-FT9NDV35BS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const isAuth = localStorage.getItem('isAuthorizedDoctor');
            const doctorName = localStorage.getItem('doctorName') || 'الصيدلي';
            const authNavArea = document.getElementById('authNavArea');

            if (isAuth === 'true') {
                authNavArea.innerHTML = `
                    <span style="color: #85c29d; font-weight: bold; padding: 6px 10px; display: inline-flex; align-items: center; gap: 5px;">
                        <i class="fa-solid fa-user-shield"></i> ${doctorName}
                    </span>
                    <button onclick="logoutSystem()" style="background: #d9534f; color: white; border: none; padding: 5px 10px; border-radius: 12px; cursor: pointer; font-size: 0.8rem; margin-right: 5px;">خروج</button>
                `;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit');
            const container = document.getElementById('medicines-inputs-container');

            if (editId) {
                try {
                    const docRef = doc(db, "patients", editId);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const pData = docSnap.data();
                        document.getElementById('pageTitle').innerHTML = `<i class="fa-solid fa-user-pen"></i> تعديل بيانات المريض (${editId})`;
                        document.getElementById('submitBtn').innerHTML = `<i class="fa-solid fa-rotate"></i> تحديث وحفظ التعديلات السحابية`;
                        document.getElementById('editingPatientId').value = editId;

                        document.getElementById('patientName').value = pData.name || '';
                        document.getElementById('patientAge').value = pData.age || '';
                        document.getElementById('patientCondition').value = pData.condition || '';
                        document.getElementById('patientAllergies').value = pData.allergies || '';

                        container.innerHTML = '';
                        if (pData.medicines && pData.medicines.length > 0) {
                            pData.medicines.forEach(m => {
                                container.appendChild(createMedCard(m.name, m.dose, m.time, m.image));
                            });
                        } else {
                            container.appendChild(createMedCard());
                        }
                        return;
                    }
                } catch (err) {
                    console.error("خطأ في جلب بيانات التعديل:", err);
                }
            }
            container.appendChild(createMedCard());
        });

        window.logoutSystem = function() {
            localStorage.removeItem('isAuthorizedDoctor');
            localStorage.removeItem('doctorName');
            window.location.href = 'signin.html';
        }

        // دالة ضغط الصورة تلقائياً لتقليل حجمها قبل الرفع لمنع تعليق الموقع
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        window.previewImage = async function(fileInput) {
            const container = fileInput.closest('.upload-container');
            const fileNameDisplay = container.querySelector('.file-name-display');
            const previewImg = container.querySelector('.preview-img');
            const file = fileInput.files[0];

            if (file) {
                fileNameDisplay.textContent = "جاري معالجة وضغط الصورة...";
                const compressedFile = await compressImage(file);
                
                // تخزين الملف المضغوط مؤقتاً في input بدلاً من الملف الأصلي الضخم
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(compressedFile);
                fileInput.files = dataTransfer.files;

                fileNameDisplay.textContent = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                }
                reader.readAsDataURL(compressedFile);
            }
        }

        function createMedCard(name = '', dose = '', time = '', imgSrc = '') {
            const newCard = document.createElement('div');
            newCard.className = 'med-card med-input-group';
            newCard.style.cssText = "background: #fafcfb; padding: 15px; border-radius: 10px; border: 1px solid #d4ebd4; margin-bottom: 12px; text-align: right;";
            
            const hasImg = imgSrc && imgSrc.length > 10;
            const imgDisplay = hasImg ? 'block' : 'none';
            const imgText = hasImg ? 'الصورة المرفقة مسجلة' : 'لم يتم اختيار صورة';

            newCard.innerHTML = `
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <input type="text" class="med-name custom-input" placeholder="اسم الدواء" value="${name}" required style="padding: 10px; border: 1px solid #cce5cc; border-radius: 6px;">
                    <input type="text" class="med-dose custom-input" placeholder="الجرعة" value="${dose}" required style="padding: 10px; border: 1px solid #cce5cc; border-radius: 6px;">
                    <input type="text" class="med-time custom-input" placeholder="التوقيت" value="${time}" required style="padding: 10px; border: 1px solid #cce5cc; border-radius: 6px;">
                </div>
                <div class="upload-container" style="display: flex; align-items: center; gap: 10px;">
                    <label style="background: #2b583f; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
                        <i class="fa-solid fa-image"></i> إرفاق صورة الدواء
                        <input type="file" class="med-image-file" accept="image/*" style="display: none;" onchange="previewImage(this)">
                    </label>
                    <span class="file-name-display" style="font-size: 0.85rem; color: #666;">${imgText}</span>
                    <input type="hidden" class="existing-img-url" value="${imgSrc}">
                    <img class="preview-img" src="${hasImg ? imgSrc : ''}" style="display: ${imgDisplay}; width: 45px; height: 45px; object-fit: cover; border-radius: 6px;" alt="معاينة">
                </div>
            `;
            return newCard;
        }

        document.getElementById('add-med-btn').addEventListener('click', () => {
            document.getElementById('medicines-inputs-container').appendChild(createMedCard());
        });

        // عملية الحفظ والتخزين السحابي السريع
        document.getElementById('doctor-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ والرفع السحابي...';

            try {
                const name = document.getElementById('patientName').value.trim();
                const age = document.getElementById('patientAge').value.trim();
                const condition = document.getElementById('patientCondition').value.trim();
                const allergies = document.getElementById('patientAllergies').value.trim() || 'لا توجد';
                const editingId = document.getElementById('editingPatientId').value.trim();

                const medicines = [];
                const medRows = document.querySelectorAll('.med-input-group');
                
                for (const row of medRows) {
                    const fileInput = row.querySelector('.med-image-file');
                    const file = fileInput.files[0];
                    let imageUrl = row.querySelector('.existing-img-url').value;

                    // رفع الصورة المضغوطة بسرعة عالية
                    if (file) {
                        const fileRef = ref(storage, `medicines_images/${Date.now()}_${file.name}`);
                        const snapshot = await uploadBytes(fileRef, file);
                        imageUrl = await getDownloadURL(snapshot
