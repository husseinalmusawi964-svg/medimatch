<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatch - البطاقة الدوائية للمريض</title>
    
    <link rel="stylesheet" href="stiyel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f4f7f5; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        .card-container { 
            max-width: 650px; 
            margin: 30px auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 18px; 
            box-shadow: 0 10px 25px rgba(43, 88, 63, 0.08); 
            border: 1px solid #d4ebd4; 
            text-align: right; 
            box-sizing: border-box; 
        }
        .med-item { 
            background: #fafcfb; 
            border: 1px solid #d4ebd4; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 15px; 
        }
        .med-img { 
            width: 65px; 
            height: 65px; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 1px solid #cce5cc; 
        }
        .badge-warning { 
            background: #fff3cd; 
            color: #856404; 
            border: 1px solid #ffeeba; 
            padding: 10px 15px; 
            border-radius: 10px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .info-label {
            color: #2b583f;
            font-weight: bold;
        }
        .info-value {
            color: #333;
        }
        @media (max-width: 600px) {
            .card-container { margin: 15px; padding: 18px; border-radius: 14px; }
            .med-item { flex-direction: column; align-items: flex-start; }
            .med-img { width: 100%; height: 120px; }
        }
    </style>
</head>
<body>

    <div class="heho">
        <a href="index.html"><img class="soso" src="imeg/IMG_9459.PNG" alt="Logo"></a>
        <div class="fofo">
            <a href="index.html">Home</a>
            <a href="help.html">Help</a>
        </div>
    </div>

    <div style="padding: 10px;">
        <div class="card-container" id="patientCard">
            <div style="text-align: center; padding: 40px; color: #2b583f;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; margin-bottom: 15px;"></i>
                <p style="font-size: 1.1rem; font-weight: bold;">جاري جلب بيانات المريض من السحابة...</p>
            </div>
        </div>
    </div>

    <!-- كود الجافاسكريبت وربط السحابة + Analytics -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrVLbKYdOZjZwo4ZpTuT2mhhJNG_UQUYc",
            authDomain: "madimatch.firebaseapp.com",
            projectId: "madimatch",
            storageBucket: "madimatch.firebasestorage.app",
            messagingSenderId: "243542423910",
            appId: "1:243542423910:web:c1e04abd18521af17fb0a7",
            measurementId: "G-2K6XK14VMT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تفعيل خدمة التحليلات للتعقب وإحصائيات زيارة بطاقة المريض
        try {
            getAnalytics(app);
        } catch (e) {
            console.log("Analytics initialization error/disabled:", e);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const patientId = urlParams.get('id');

            if (!patientId) {
                renderNotFound("لم يتم تحديد معرف المريض في الرابط!");
                return;
            }

            try {
                const docRef = doc(db, "patients", patientId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const patient = docSnap.data();
                    renderPatientData(patient, patientId);
                } else {
                    renderNotFound("عذراً، لم يتم العثور على سجل هذا المريض في السحابة.");
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات المريض:", error);
                renderNotFound("حدث خطأ أثناء الاتصال بالسحابة: " + error.message);
            }
        });

        function renderPatientData(patient, patientId) {
            const container = document.getElementById('patientCard');
            
            let medicinesHTML = '';
            if (patient.medicines && patient.medicines.length > 0) {
                patient.medicines.forEach(med => {
                    const hasImg = med.image && med.image.length > 10;
                    medicinesHTML += `
                        <div class="med-item">
                            <div style="flex: 1;">
                                <h4 style="margin: 0 0 5px 0; color: #2b583f; font-size: 1.1rem;">
                                    <i class="fa-solid fa-capsules"></i> ${med.name}
                                </h4>
                                <p style="margin: 3px 0; color: #555; font-size: 0.9rem;"><strong>الجرعة:</strong> ${med.dose}</p>
                                <p style="margin: 3px 0; color: #777; font-size: 0.85rem;"><strong>التوقيت:</strong> ${med.time}</p>
                            </div>
                            ${hasImg ? `<img src="${med.image}" class="med-img" alt="${med.name}">` : ''}
                        </div>
                    `;
                });
            } else {
                medicinesHTML = `<p style="text-align: center; color: #888;">لا توجد أدوية مسجلة في هذا الجدول.</p>`;
            }

            let allergyHTML = '';
            if (patient.allergies && patient.allergies.trim() !== '' && patient.allergies !== 'لا توجد') {
                allergyHTML = `
                    <div class="badge-warning">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 1.3rem;"></i>
                        <div>
                            <span style="display: block; font-size: 0.85rem;">تحذير طبي - حساسية الأدوية:</span>
                            <span style="font-size: 1rem;">${patient.allergies}</span>
                        </div>
                    </div>
                `;
            }

            let notesHTML = '';
            if (patient.notes && patient.notes.trim() !== '') {
                notesHTML = `
                    <div style="background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #cce5cc; margin-top: 10px;">
                        <span class="info-label" style="display: block; margin-bottom: 4px;"><i class="fa-solid fa-clipboard-list"></i> تعليمات وملاحظات الطبيب/الصيدلي:</span>
                        <span class="info-value" style="white-space: pre-line;">${patient.notes}</span>
                    </div>
                `;
            }

            container.innerHTML = `
                <div style="text-align: center; border-bottom: 2px solid #e2efe2; padding-bottom: 20px; margin-bottom: 20px;">
                    <img src="imeg/IMG_9459.PNG" style="width: 70px; height: 70px; object-fit: contain; margin-bottom: 10px;" alt="Logo">
                    <h2 style="color: #2b583f; margin: 0; font-size: 1.5rem;">البطاقة الدوائية الرقمية</h2>
                    <span style="background: #2b583f; color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-top: 8px;">
                        المعرف السحابي: ${patientId}
                    </span>
                </div>

                ${allergyHTML}

                <div style="background: #f0f7f4; padding: 18px; border-radius: 14px; border: 1px solid #d4ebd4; margin-bottom: 25px;">
                    <h3 style="color: #2b583f; margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; border-bottom: 1px solid #cce5cc; padding-bottom: 6px;">
                        <i class="fa-solid fa-user-nurse"></i> بيانات المريض الشخصية
                    </h3>
                    <div class="info-row">
                        <span class="info-label">اسم المريض:</span>
                        <span class="info-value"><strong>${patient.name || 'غير محدد'}</strong></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">العمر:</span>
                        <span class="info-value">${patient.age || 'غير محدد'} سنة</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">الحالة التشخيصية:</span>
                        <span class="info-value">${patient.condition || 'غير محددة'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">المشرف الطبي:</span>
                        <span class="info-value">${patient.doctorName || 'الصيدلي المشرف'}</span>
                    </div>
                    ${notesHTML}
                </div>

                <h3 style="color: #2b583f; font-size: 1.15rem; margin-bottom: 12px;">
                    <i class="fa-solid fa-pills"></i> الوصفة الدوائية المحددة
                </h3>
                
                ${medicinesHTML}

                <div style="text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid #e2efe2;">
                    <button onclick="window.print()" style="background: #2b583f; color: white; border: none; padding: 10px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.9rem;">
                        <i class="fa-solid fa-print"></i> طباعة البطاقة
                    </button>
                </div>
            `;
        }

        function renderNotFound(message) {
            const container = document.getElementById('patientCard');
            container.innerHTML = `
                <div style="text-align: center; padding: 30px; color: #721c24; background: #f8d7da; border-radius: 14px; border: 1px solid #f5c6cb;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 2.5rem; margin-bottom: 10px;"></i>
                    <h3 style="margin: 0 0 8px 0;">خطأ في جلب البيانات</h3>
                    <p style="margin: 0; font-size: 0.95rem;">${message}</p>
                    <a href="index.html" style="display: inline-block; margin-top: 15px; color: #2b583f; font-weight: bold; text-decoration: none;">
                        <i class="fa-solid fa-house"></i> العودة للرئيسية
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
