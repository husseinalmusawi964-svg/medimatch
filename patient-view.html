<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatch - إضافة وتعديل مريض</title>
    
    <script>
        if (localStorage.getItem('isAuthorizedDoctor') !== 'true') {
            alert('⚠️ غير مصرح لك بالدخول!');
            window.location.href = 'signin.html';
        }
    </script>

    <link rel="stylesheet" href="sooo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body style="background-color: #f4f7f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0;">

    <div class="heho">
        <a href="index.html"><img class="soso" src="imeg/IMG_9459.PNG" alt="Logo"></a>
        <div class="fofo" id="navLinksContainer">
            <a href="index.html">Home</a>
            <a href="my-patients.html">My Patients</a>
            <a href="add-patient.html" style="color: #2b583f; font-weight: bold;">Add patient</a>
            <a href="help.html">Help</a>
            <span id="authNavArea">
                <a href="signin.html" style="color: #2b583f; font-weight: bold;">Sign In</a>
            </span>
        </div>
    </div>

    <div style="padding: 30px 20px;">
        <div style="max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(43, 88, 63, 0.08); border: 1px solid #d4ebd4;">
            
            <h2 id="pageTitle" style="color: #2b583f; margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; text-align: right;">
                <i class="fa-solid fa-user-plus"></i> إدخال بيانات المريض والأدوية
            </h2>
            
            <form id="doctor-form">
                <input type="hidden" id="editingSerialId" value="">

                <div style="background: #f0f7f4; padding: 18px; border-radius: 12px; border: 1px solid #d4ebd4; margin-bottom: 20px;">
                    <div style="margin-bottom: 12px; text-align: right;">
                        <label style="display: block; margin-bottom: 5px; color: #2b583f; font-weight: bold; font-size: 0.9rem;">اسم المريض الكامل:</label>
                        <input type="text" id="patientName" class="custom-input" style="width: 100%;" required placeholder="مثال: أحمد محمد">
                    </div>

                    <div style="display: flex; gap: 12px; text-align: right; margin-bottom: 12px;">
                        <div style="flex: 1;">
                            <label style="display: block; margin-bottom: 5px; color: #2b583f; font-weight: bold; font-size: 0.9rem;">العمر:</label>
                            <input type="number" id="patientAge" class="custom-input" style="width: 100%;" required placeholder="مثال: 50">
                        </div>
                        <div style="flex: 2;">
                            <label style="display: block; margin-bottom: 5px; color: #2b583f; font-weight: bold; font-size: 0.9rem;">الحالة الصحية / الأمراض المزمنة:</label>
                            <input type="text" id="patientCondition" class="custom-input" style="width: 100%;" required placeholder="مثال: سكري وضغط الدم">
                        </div>
                    </div>

                    <div style="text-align: right;">
                        <label style="display: block; margin-bottom: 5px; color: #b22222; font-weight: bold; font-size: 0.9rem;">
                            <i class="fa-solid fa-triangle-exclamation"></i> حساسية الأدوية (إن وجدت):
                        </label>
                        <input type="text" id="patientAllergies" class="custom-input" style="width: 100%; border-color: #f5c6cb; background: #fffdfd;" placeholder="مثال: حساسية من البنسلين...">
                    </div>
                </div>

                <h3 style="color: #2b583f; font-size: 1.1rem; margin-bottom: 12px; text-align: right;">
                    <i class="fa-solid fa-pills"></i> قائمة الأدوية
                </h3>
                
                <div id="medicines-inputs-container"></div>

                <div style="margin-bottom: 20px;">
                    <button type="button" id="add-med-btn" class="btn-add-more">
                        <i class="fa-solid fa-plus"></i> إضافة دواء آخر
                    </button>
                </div>
                
                <button type="submit" id="submitBtn" class="btn-submit-main">
                    <i class="fa-solid fa-qrcode"></i> حفظ وتوليد بطاقة الـ QR Code
                </button>
            </form>

            <div id="qrcode-section" style="text-align: center; margin-top: 30px; display: none; padding-top: 20
