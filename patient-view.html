<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatch - البطاقة الدوائية الرقمية</title>
    
    <link rel="stylesheet" href="sooo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase المطلوبة -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: #f4f7f5; font-family: sans-serif; margin: 0; padding: 0;">

    <div class="heho">
        <a href="index.html"><img class="soso" src="imeg/IMG_9459.PNG" alt="Logo"></a>
        <div class="fofo">
            <a href="index.html">الرئيسية</a>
            <a href="help.html">المساعدة</a>
        </div>
    </div>

    <div style="max-width: 700px; margin: 30px auto; padding: 0 15px;">
        <div style="background: #fff; border-radius: 16px; padding: 25px; border: 1px solid #d4ebd4; box-shadow: 0 8px 20px rgba(0,0,0,0.05);">
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fa-solid fa-id-card-clip" style="font-size: 2.5rem; color: #2b583f;"></i>
                <h2 style="color: #2b583f; margin: 8px 0;">البطاقة الدوائية الرقمية</h2>
            </div>

            <div style="background: #f0f7f4; padding: 18px; border-radius: 12px; border: 1px solid #d4ebd4; margin-bottom: 20px;">
                <p><strong>اسم المريض:</strong> <span id="viewName">جاري الجلب من السحابة...</span></p>
                <p><strong>العمر:</strong> <span id="viewAge">-</span></p>
                <p><strong>الحالة الصحية:</strong> <span id="viewCondition">-</span></p>
                <p style="color: #b22222;"><strong>حساسية الأدوية:</strong> <span id="viewAllergies">-</span></p>
            </div>

            <h3 style="color: #2b583f;"><i class="fa-solid fa-pills"></i> الجدول الدوائي:</h3>
            <div id="viewMeds"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDrVLbKYdOZjZwo4ZpTuT2mhhJNG_UQUYc",
            authDomain: "madimatch.firebaseapp.com",
            projectId: "madimatch",
            storageBucket: "madimatch.firebasestorage.app",
            messagingSenderId: "243542423910",
            appId: "1:243542423910:web:d8082bc3a372a5557fb0a7",
            measurementId: "G-EGM9Y42FZ7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const serialId = urlParams.get('id');

            if (!serialId) {
                document.getElementById('viewName').textContent = 'عذراً، رابط غير صحيح!';
                return;
            }

            const doc = await db.collection('patients').doc(serialId).get();
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('viewName').textContent = data.name;
                document.getElementById('viewAge').textContent = data.age + ' سنة';
                document.getElementById('viewCondition').textContent = data.condition;
                document.getElementById('viewAllergies').textContent = data.allergies || 'لا توجد';

                let html = '';
                if (data.medicines && data.medicines.length > 0) {
                    data.medicines.forEach((m, i) => {
                        html += `
                            <div style="background: #fafcfb; border: 1px solid #d4ebd4; padding: 10px; border-radius: 8px; margin-bottom: 8px;">
                                <b>${i+1}. ${m.name}</b> - الجرعة: ${m.dose} - التوقيت: ${m.time}
                            </div>`;
                    });
                } else {
                    html = '<p>لا توجد أدوية مسجلة.</p>';
                }
                document.getElementById('viewMeds').innerHTML = html;
            } else {
                document.getElementById('viewName').textContent = 'لم يتم العثور على المريض بالسحابة!';
            }
        });
    </script>
</body>
</html>
