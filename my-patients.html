<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatch - سجل المرضى والصيدليات</title>

    <script>
        if (localStorage.getItem('isAuthorizedDoctor') !== 'true') {
            window.location.href = 'signin.html';
        }
    </script>

    <link rel="stylesheet" href="stiyel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        .main-container { max-width: 800px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(43, 88, 63, 0.08); border: 1px solid #d4ebd4; text-align: right; box-sizing: border-box; }
        
        .search-container {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }
        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #2b583f;
            font-size: 1.1rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .search-container.active-search i {
            color: #1b3a29;
            transform: translateY(-50%) scale(1.15);
        }
        .search-box { 
            width: 100%; 
            padding: 13px 45px 13px 15px; 
            border: 1px solid #cce5cc; 
            border-radius: 30px; 
            font-size: 0.95rem; 
            background: #fafcfb; 
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.3s ease;
            color: #333;
        }
        .search-box:focus { 
            border-color: #2b583f; 
            background: #fff; 
            box-shadow: 0 4px 12px rgba(43, 88, 63, 0.12); 
        }

        .patient-card { background: #ffffff; border: 1px solid #e2efe2; padding: 15px; border-radius: 12px; margin-top: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .patient-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4ebd4; padding-bottom: 8px; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }

        .action-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .btn-action { text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; border: none; }
        .btn-view { background: #2b583f; color: white; }
        .btn-edit { background: #e2efe2; color: #2b583f; border: 1px solid #2b583f; }

        @media (max-width: 600px) {
            .main-container { margin: 10px; padding: 15px; border-radius: 12px; }
            .patient-header { flex-direction: column; align-items: flex-start; }
            .action-btns { width: 100%; }
            .btn-action { flex: 1; justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="heho">
        <a href="index.html"><img class="soso" src="imeg/IMG_9459.PNG" alt="Logo"></a>
        <div class="fofo">
            <a href="index.html">Home</a>
            <a href="add-patient.html">Add patient</a>
            <a href="help.html">Help</a>
            <button id="logoutBtn" style="background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 0.85rem;">خروج</button>
        </div>
    </div>

    <div style="padding: 10px;">
        <div class="main-container">
            
            <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e2efe2; padding-bottom: 12px;">
                <div style="font-size: 2.2rem; color: #2b583f; margin-bottom: 5px;"><i class="fa-solid fa-clinic-medical"></i></div>
                <h2 style="color: #2b583f; margin: 0; font-size: 1.4rem;">سجل المرضى السحابي</h2>
                <p style="color: #666; font-size: 0.85rem; margin-top: 4px;">إدارة وعرض كافّة المرضى والجدول الدوائي عبر السحابة</p>
            </div>

            <!-- مربع البحث التفاعلي -->
            <div class="search-container" id="searchWrapper">
                <i class="fa-solid fa-magnifying-glass" id="searchIcon"></i>
                <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم المريض أو المعرف (ID)...">
            </div>

            <div id="patientsListContainer">
                <p style="text-align: center; color: #888;">جاري جلب المرضى من السحابة...</p>
            </div>

            <div style="text-align: center; margin-top: 25px;">
                <a href="index.html" style="background: #2b583f; color: white; text-decoration: none; padding: 10px 22px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; display: inline-block;">العودة للصفحة الرئيسية</a>
            </div>

        </div>
    </div>

    <!-- كود الجافاسكريبت والربط السحابي مع الفايربيس والبحث التفاعلي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrVLbKYdOZjZwo4ZpTuT2mhhJNG_UQUYc",
            authDomain: "madimatch.firebaseapp.com",
            projectId: "madimatch",
            storageBucket: "madimatch.firebasestorage.app",
            messagingSenderId: "243542423910",
            appId: "1:243542423910:web:98422e0330e2b8237fb0a7",
            measurementId: "G-FT9NDV35BS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        try { getAnalytics(app); } catch (e) {}

        let allPatientsData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadPatientsFromCloud();

            const searchInput = document.getElementById('searchInput');
            const searchWrapper = document.getElementById('searchWrapper');
            const searchIcon = document.getElementById('searchIcon');

            // تفعيل التفاعل مع خانة البحث وأيقونة العدسة
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    const term = searchInput.value.trim();
                    if (term.length > 0) {
                        searchWrapper.classList.add('active-search');
                        searchIcon.className = "fa-solid fa-spinner fa-spin"; // تأثير الحركة عند الكتابة
                        setTimeout(() => {
                            searchIcon.className = "fa-solid fa-magnifying-glass";
                        }, 250);
                    } else {
                        searchWrapper.classList.remove('active-search');
                        searchIcon.className = "fa-solid fa-magnifying-glass";
                    }
                    filterPatients();
                });
            }

            // زر الخروج
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    localStorage.removeItem('isAuthorizedDoctor');
                    localStorage.removeItem('doctorName');
                    window.location.href = 'signin.html';
                });
            }
        });

        async function loadPatientsFromCloud() {
            const container = document.getElementById('patientsListContainer');
            try {
                // جلب المرضى مرتبين حسب أحدث تعديل
                const q = query(collection(db, "patients"), orderBy("updatedAt", "desc"));
                const querySnapshot = await getDocs(q);

                allPatientsData = [];
                querySnapshot.forEach((docSnap) => {
                    allPatientsData.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderPatientsList(allPatientsData);
            } catch (error) {
                console.error("خطأ في جلب بيانات السحابة:", error);
                
                // محاولة جلب بدون ترتيب لتفادي أي خطأ بالفهارس (Indexes)
                try {
                    const fallbackSnap = await getDocs(collection(db, "patients"));
                    allPatientsData = [];
                    fallbackSnap.forEach((docSnap) => {
                        allPatientsData.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    renderPatientsList(allPatientsData);
                } catch(err) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #d9534f;">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 8px;"></i>
                            <p style="font-weight: bold; margin: 0;">حدث خطأ أثناء تحميل سجل المرضى من السحابة.</p>
                        </div>
                    `;
                }
            }
        }

        function renderPatientsList(patients) {
            const container = document.getElementById('patientsListContainer');

            if (patients.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 25px; background: #fafcfb; border-radius: 12px; border: 1px dashed #d4ebd4; color: #777;">
                        <i class="fa-solid fa-folder-open" style="font-size: 2rem; color: #a5d6a5; margin-bottom: 8px;"></i>
                        <p style="margin: 0; font-weight: bold;">لا يوجد مرضى مطابقون لنتائج البحث.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            patients.forEach(patient => {
                let medsHTML = '';
                if (patient.medicines && Array.isArray(patient.medicines) && patient.medicines.length > 0) {
                    medsHTML = '<ul style="padding-right: 18px; margin: 6px 0 0 0; color: #444; font-size: 0.88rem;">';
                    patient.medicines.forEach(med => {
                        medsHTML += `<li><b>${med.name || 'دواء'}</b> - الجرعة: ${med.dose || 'غير محددة'} (${med.time || 'غير محدد'})</li>`;
                    });
                    medsHTML += '</ul>';
                } else {
                    medsHTML = '<p style="margin: 4px 0; font-size: 0.85rem; color: #888;">لا توجد أدوية مضافة.</p>';
                }

                const patientCard = document.createElement('div');
                patientCard.className = 'patient-card';
                patientCard.innerHTML = `
                    <div class="patient-header">
                        <h4 style="color: #2b583f; margin: 0; font-size: 1.05rem;">
                            <i class="fa-solid fa-user-injured"></i> ${patient.name || 'بدون اسم'}
                        </h4>
                        <span style="background: #e2efe2; color: #2b583f; padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: bold;">
                            ID: ${patient.id}
                        </span>
                    </div>
                    <div style="font-size: 0.88rem; color: #555; margin-bottom: 6px;">
                        <span><b>العمر:</b> ${patient.age || '-'} سنة</span> | 
                        <span><b>الحالة:</b> ${patient.condition || '-'}</span>
                    </div>
                    ${patient.allergies ? `<div style="font-size: 0.85rem; color: #b22222; margin-bottom: 6px;"><b>حساسية:</b> ${patient.allergies}</div>` : ''}
                    <div>
                        <strong style="color: #2b583f; font-size: 0.9rem;">الأدوية المسجلة:</strong>
                        ${medsHTML}
                    </div>
                    <div class="action-btns">
                        <!-- تم ربط الرابط بـ patient-view.html -->
                        <a href="patient-view.html?id=${patient.id}" class="btn-action btn-view" target="_blank">
                            <i class="fa-solid fa-eye"></i> معاينة البطاقة
                        </a>
                        <a href="add-patient.html?edit=${patient.id}" class="btn-action btn-edit">
                            <i class="fa-solid fa-pen-to-square"></i> تعديل
                        </a>
                    </div>
                `;
                container.appendChild(patientCard);
            });
        }

        function filterPatients() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = allPatientsData.filter(p => {
                const nameMatch = p.name && p.name.toLowerCase().includes(term);
                const idMatch = p.id && p.id.toLowerCase().includes(term);
                return nameMatch || idMatch;
            });
            renderPatientsList(filtered);
        }
    </script>
</body>
</html>
