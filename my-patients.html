<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatch - سجل المرضى والصيدليات</title>

    <script>
        if (localStorage.getItem('isAuthorizedDoctor') !== 'true') {
            window.location.href = 'signin.html';
        }
    </script>

    <link rel="stylesheet" href="stiyel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        .main-container { max-width: 800px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(43, 88, 63, 0.08); border: 1px solid #d4ebd4; text-align: right; box-sizing: border-box; }
        
        .search-container {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }
        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #2b583f;
            font-size: 1.1rem;
            pointer-events: none;
            transition: 0.3s;
        }
        .search-box { 
            width: 100%; 
            padding: 13px 45px 13px 15px; 
            border: 1px solid #cce5cc; 
            border-radius: 30px; 
            font-size: 0.95rem; 
            background: #fafcfb; 
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.3s ease;
            color: #333;
        }
        .search-box:focus { 
            border-color: #2b583f; 
            background: #fff; 
            box-shadow: 0 4px 12px rgba(43, 88, 63, 0.12); 
        }

        .patient-card { background: #ffffff; border: 1px solid #e2efe2; padding: 15px; border-radius: 12px; margin-top: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .patient-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4ebd4; padding-bottom: 8px; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }

        .action-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .btn-action { text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; border: none; }
        .btn-view { background: #2b583f; color: white; }
        .btn-edit { background: #e2efe2; color: #2b583f; border: 1px solid #2b583f; }

        @media (max-width: 600px) {
            .main-container { margin: 10px; padding: 15px; border-radius: 12px; }
            .patient-header { flex-direction: column; align-items: flex-start; }
            .action-btns { width: 100%; }
            .btn-action { flex: 1; justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="heho">
        <a href="index.html"><img class="soso" src="imeg/IMG_9459.PNG" alt="Logo"></a>
        <div class="fofo">
            <a href="index.html">Home</a>
            <a href="add-patient.html">Add patient</a>
            <a href="help.html">Help</a>
            <button onclick="logoutSystem()" style="background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 0.85rem;">خروج</button>
        </div>
    </div>

    <div style="padding: 10px;">
        <div class="main-container">
            
            <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e2efe2; padding-bottom: 12px;">
                <div style="font-size: 2.2rem; color: #2b583f; margin-bottom: 5px;"><i class="fa-solid fa-clinic-medical"></i></div>
                <h2 style="color: #2b583f; margin: 0; font-size: 1.4rem;">سجل المرضى السحابي</h2>
                <p style="color: #666; font-size: 0.85rem; margin-top: 4px;">إدارة وعرض كافّة المرضى والجدول الدوائي عبر السحابة</p>
            </div>

            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم المريض أو المعرف (ID)..." onkeyup="filterPatients()">
            </div>

            <div id="patientsListContainer">
                <p style="text-align: center; color: #888;">جاري جلب المرضى من السحابة...</p>
            </div>

            <div style="text-align: center; margin-top: 25px;">
                <a href="index.html" style="background: #2b583f; color: white; text-decoration: none; padding: 10px 22px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; display: inline-block;">العودة للصفحة الرئيسية</a>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrVLbKYdOZjZwo4ZpTuT2mhhJNG_UQUYc",
            authDomain: "madimatch.firebaseapp.com",
            projectId: "madimatch",
            storageBucket: "madimatch.firebasestorage.app",
            messagingSenderId: "243542423910",
            appId: "1:243542423910:web:98422e0330e2b8237fb0a7",
            measurementId: "G-FT9NDV35BS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPatientsData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadPatientsFromCloud();
        });

        async function loadPatientsFromCloud() {
            const container = document.getElementById('patientsListContainer');
            try {
                const q = query(collection(db, "patients"), orderBy("updatedAt", "desc"));
                const querySnapshot = await getDocs(q);

                allPatientsData = [];
                querySnapshot.forEach((doc) => {
                    allPatientsData.push({ id: doc.id, ...doc.data() });
                });

                renderPatientsList(allPatientsData);
            } catch (error) {
                console.error("خطأ في جلب بيانات السحابة:", error);
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #d9534f;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 2rem; margin-bottom: 8px;"></i>
                        <p style="font-weight: bold; margin: 0;">حدث خطأ أثناء تحميل سجل المرضى من السحابة.</p>
                    </div>
                `;
            }
        }

        function renderPatientsList(patients) {
            const container = document.getElementById('patientsListContainer');

            if (patients.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 25px; background: #fafcfb; border-radius: 12px; border: 1px dashed #d4ebd4; color: #777;">
                        <i class="fa-solid fa-folder-open" style="font-size: 2rem; color: #a5d6a5; margin-bottom: 8px;"></i>
                        <p style="margin: 0; font-weight: bold;">لا يوجد مرضى مطابقون لنتائج البحث.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            patients.forEach(patient => {
                let medsHTML = '';
                if (patient.medicines && patient.medicines.length > 0) {
                    medsHTML = '<ul style="padding-right: 18px; margin: 6px 0 0 0; color: #444; font-size: 0.88rem;">';
                    patient.medicines.forEach(med => {
                        medsHTML += `<li><b>${med.name}</b> - الجرعة: ${med.dose} (${med.time})</li>`;
                    });
                    medsHTML += '</ul>';
                } else {
                    medsHTML = '<p style="margin: 4px 0; font-size: 0.85rem; color: #888;">لا توجد أدوية مضافة.</p>';
                }

                const patientCard = document.createElement('div');
                patientCard.className = 'patient-card';
                patientCard.innerHTML = `
                    <div class="patient-header">
                        <h4 style="color: #2b583f; margin: 0; font-size: 1.05rem;">
                            <i class="fa-solid fa-user-injured"></i> ${patient.name}
                        </h4>
                        <span style="background: #2b583f; color:
