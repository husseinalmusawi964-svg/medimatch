<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediMatch - سجل المرضى السحابي</title>
    
    <link rel="stylesheet" href="stiyel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase المطلوبة -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body style="background-color: #f4f7f5; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0;">

    <div class="heho">
        <a href="index.html"><img class="soso" src="imeg/IMG_9459.PNG" alt="Logo"></a>
        <div class="fofo">
            <a href="index.html">الرئيسية</a>
            <a href="my-patients.html" style="color: #2b583f; font-weight: bold;">مرضاي</a>
            <a href="add-patient.html">إضافة مريض</a>
            <a href="help.html">المساعدة</a>
        </div>
    </div>

    <div style="max-width: 900px; margin: 30px auto; padding: 0 15px;">
        <div style="background: #fff; border-radius: 16px; padding: 25px; box-shadow: 0 8px 20px rgba(43,88,63,0.08); border: 1px solid #d4ebd4;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eef3f0; padding-bottom: 12px;">
                <h2 style="color: #2b583f; margin: 0; font-size: 1.3rem;">
                    <i class="fa-solid fa-users-rectangle"></i> سجل المرضى المعتمدين (سحابياً)
                </h2>
                <a href="add-patient.html" style="background: #2b583f; color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.88rem; font-weight: bold;">
                    <i class="fa-solid fa-plus"></i> إضافة مريض جديد
                </a>
            </div>

            <div id="patientsListContainer">
                <p style="text-align: center; color: #666; padding: 20px;">جاري جلب قائمة المرضى من السحابة...</p>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDrVLbKYdOZjZwo4ZpTuT2mhhJNG_UQUYc",
            authDomain: "madimatch.firebaseapp.com",
            projectId: "madimatch",
            storageBucket: "madimatch.firebasestorage.app",
            messagingSenderId: "243542423910",
            appId: "1:243542423910:web:d8082bc3a372a5557fb0a7",
            measurementId: "G-EGM9Y42FZ7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('patientsListContainer');
            try {
                const snapshot = await db.collection('patients').get();
                
                if (snapshot.empty) {
                    container.innerHTML = '<p style="text-align: center; color: #777; padding: 25px;">لا توجد سجلات مرضى مسجلة في السحابة حالياً.</p>';
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const patient = doc.data();
                    html += `
                        <div style="background: #fafcfb; border: 1px solid #d4ebd4; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                            <div>
                                <h4 style="margin: 0 0 5px 0; color: #2b583f; font-size: 1.05rem;">
                                    <i class="fa-solid fa-user"></i> ${patient.name} 
                                    <span style="font-size: 0.8rem; background: #eef3f0; color: #555; padding: 2px 8px; border-radius: 6px; margin-right: 8px;">${patient.serialId}</span>
                                </h4>
                                <p style="margin: 3px 0; color: #555; font-size: 0.88rem;">العمر: ${patient.age} سنة | الحالة: <b>${patient.condition}</b></p>
                                <p style="margin: 3px 0; color: #b22222; font-size: 0.82rem;">الحساسية: ${patient.allergies || 'لا توجد'}</p>
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <a href="patient-view.html?id=${patient.serialId}" target="_blank" style="background: #2b583f; color: white; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold;">
                                    <i class="fa-solid fa-eye"></i> عرض البطاقة
                                </a>
                                <button onclick="deleteCloudPatient('${patient.serialId}')" style="background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">
                                    <i class="fa-solid fa-trash"></i> حذف
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<p style="text-align: center; color: #d9534f; padding: 20px;">حدث خطأ أثناء جلب البيانات: ${error.message}</p>`;
            }
        });

        async function deleteCloudPatient(serialId) {
            if (confirm('هل أنت متأكد من حذف سجل هذا المريض نهائياً من السحابة؟')) {
                try {
                    await db.collection('patients').doc(serialId).delete();
                    alert('تم حذف المريض بنجاح.');
                    location.reload();
                } catch (error) {
                    alert('فشل الحذف: ' + error.message);
                }
            }
        }
    </script>
</body>
</html>
